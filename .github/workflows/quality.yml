name: Quality

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - name: Create virtual environment
        run: python -m venv .venv

      - name: Install Python dependencies
        run: .venv/bin/python -m pip install -r tools/requirements.txt

      - name: Run tools tests
        run: python -m unittest discover -s tools/tests -p 'test_*.py'

      - name: Run ML tests
        run: .venv/bin/python -m unittest discover -s ml/tests -t . -p 'test_*.py'

  web-quality:
    name: Angular tests, typecheck, and build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Enable Corepack
        run: corepack enable

      - name: Install JavaScript dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Run Angular unit tests
        run: corepack pnpm web:test

      - name: Typecheck E2E tests
        run: corepack pnpm --dir apps/web e2e:typecheck

      - name: Build Angular for production
        run: corepack pnpm web:build
